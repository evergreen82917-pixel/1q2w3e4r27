<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고급 계산기 웹앱</title>
    <style>
        :root {
            --bg-color: #1a1c1e;
            --display-bg: #2d312a;
            --text-color: #e2e3dd;
            --op-text-color: #a7ac9a;
            --btn-num-bg: #1a1c1e;
            --btn-op-bg: #2d312a;
            --btn-ac-bg: #b8eee1;
            --btn-eq-bg: #e1e99c;
            --btn-text-num: #e2e3dd;
            --btn-text-ac: #00201a;
            --btn-text-eq: #1a1c1e;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .calculator-container {
            width: 360px;
            height: 700px;
            background-color: var(--bg-color);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .display-container {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            background-color: var(--display-bg);
            color: var(--text-color);
            position: relative;
        }
        
        .mode-indicator {
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 15px;
            color: var(--op-text-color);
            font-weight: bold;
        }

        .expression {
            font-size: 40px;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow-x: auto;
            max-width: 100%;
            direction: ltr;
        }

        .result {
            font-size: 30px;
            color: var(--op-text-color);
            min-height: 38px;
        }

        .button-pad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 16px;
            padding-bottom: 24px;
        }

        button {
            border: none;
            border-radius: 40px;
            height: 56px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: filter 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        button.num {
            background-color: var(--btn-num-bg);
            color: var(--btn-text-num);
        }
        button.op {
            background-color: var(--btn-op-bg);
            color: var(--op-text-color);
        }
        button.func {
            background-color: var(--btn-op-bg);
            color: var(--text-color);
            font-size: 16px;
        }
        button.ac {
            background-color: var(--btn-ac-bg);
            color: var(--btn-text-ac);
        }
        button.equal {
            background-color: var(--btn-eq-bg);
            color: var(--btn-text-eq);
        }

        button:active {
            filter: brightness(1.3);
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <!-- 디스플레이 영역 -->
    <div class="display-container">
        <div class="mode-indicator" id="modeIndicator">RAD</div>
        <div class="expression" id="expression">0</div>
        <div class="result" id="result"></div>
    </div>

    <!-- 버튼 패드 -->
    <div class="button-pad">
        <!-- 1행 -->
        <button class="func" onclick="pushToken('Math.sqrt(')">√</button>
        <button class="func" onclick="pushToken('Math.PI')">π</button>
        <button class="func" onclick="pushToken('Math.E')">e</button>
        <button class="func" onclick="pushToken('!')">!</button>

        <!-- 2행 -->
        <button class="func" onclick="toggleDegRad()" id="degRadBtn">RAD</button>
        <button class="func" onclick="pushToken('Math.sin(')">sin</button>
        <button class="func" onclick="pushToken('Math.cos(')">cos</button>
        <button class="func" onclick="pushToken('Math.tan(')">tan</button>

        <!-- 3행 -->
        <button class="func" onclick="pushToken('1/(')">1/x</button>
        <button class="func" onclick="pushToken('Math.log(')">ln</button>
        <button class="func" onclick="pushToken('Math.log10(')">log</button>
        <button class="op" onclick="pushToken('**')">^</button>

        <!-- 4행 -->
        <button class="ac" onclick="clearAll()">AC</button>
        <button class="op" onclick="pushToken('(')">(</button>
        <button class="op" onclick="pushToken(')')">)</button>
        <button class="op" onclick="pushToken('/')">÷</button>

        <!-- 5행 -->
        <button class="num" onclick="pushToken('7')">7</button>
        <button class="num" onclick="pushToken('8')">8</button>
        <button class="num" onclick="pushToken('9')">9</button>
        <button class="op" onclick="pushToken('*')">×</button>

        <!-- 6행 -->
        <button class="num" onclick="pushToken('4')">4</button>
        <button class="num" onclick="pushToken('5')">5</button>
        <button class="num" onclick="pushToken('6')">6</button>
        <button class="op" onclick="pushToken('-')">−</button>

        <!-- 7행 -->
        <button class="num" onclick="pushToken('1')">1</button>
        <button class="num" onclick="pushToken('2')">2</button>
        <button class="num" onclick="pushToken('3')">3</button>
        <button class="op" onclick="pushToken('+')">+</button>

        <!-- 8행 -->
        <button class="num" onclick="pushToken('0')">0</button>
        <button class="num" onclick="pushToken('.')">.</button>
        <button class="op" onclick="backspace()">⌫</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const expressionDisplay = document.getElementById('expression');
    const resultDisplay = document.getElementById('result');
    const degRadBtn = document.getElementById('degRadBtn');
    const modeIndicator = document.getElementById('modeIndicator');
    
    let currentExpression = '';
    let isRadMode = true;
    let isCalculated = false;

    function pushToken(token) {
        if (isCalculated) {
            if (!isOperator(token) && token !== '**') {
                currentExpression = '';
            }
            isCalculated = false;
        }

        currentExpression += token;
        updateDisplay();
    }

    function updateDisplay() {
        if (currentExpression === '') {
            expressionDisplay.innerText = '0';
            resultDisplay.innerText = '';
            return;
        }

        let displayStr = currentExpression
            .replace(/\*/g, '×')
            .replace(/\//g, '÷')
            .replace(/Math\.sqrt\(/g, '√(')
            .replace(/Math\.PI/g, 'π')
            .replace(/Math\.E/g, 'e')
            .replace(/Math\.log\(/g, 'ln(')
            .replace(/Math\.log10\(/g, 'log(')
            .replace(/\*\*/g, '^');
            
        expressionDisplay.innerText = displayStr;

        try {
            let evalStr = prepareEvalString(currentExpression);
            let tempResult = eval(evalStr);
            if (!isNaN(tempResult) && isFinite(tempResult)) {
                resultDisplay.innerText = formatResult(tempResult);
            } else {
                resultDisplay.innerText = '';
            }
        } catch (e) {
            resultDisplay.innerText = '';
        }
    }

    function clearAll() {
        currentExpression = '';
        isCalculated = false;
        resultDisplay.innerText = '';
        updateDisplay();
    }

    function backspace() {
        if (isCalculated) {
            clearAll();
            return;
        }

        if (currentExpression.endsWith('Math.sqrt(')) currentExpression = currentExpression.slice(0, -10);
        else if (currentExpression.endsWith('Math.PI')) currentExpression = currentExpression.slice(0, -7);
        else if (currentExpression.endsWith('Math.E')) currentExpression = currentExpression.slice(0, -6);
        else if (currentExpression.endsWith('Math.log(')) currentExpression = currentExpression.slice(0, -9);
        else if (currentExpression.endsWith('Math.log10(')) currentExpression = currentExpression.slice(0, -11);
        else if (currentExpression.endsWith('**')) currentExpression = currentExpression.slice(0, -2);
        else currentExpression = currentExpression.slice(0, -1);
        
        updateDisplay();
    }

    function calculate() {
        try {
            if (currentExpression === '') return;
            
            let evalStr = prepareEvalString(currentExpression);
            let result = eval(evalStr);
            
            if (isNaN(result) || !isFinite(result)) {
                resultDisplay.innerText = 'Error';
            } else {
                resultDisplay.innerText = formatResult(result);
                currentExpression = result.toString();
                isCalculated = true;
            }
        } catch (error) {
            resultDisplay.innerText = 'Error';
        }
    }

    function prepareEvalString(expr) {
        if (!isRadMode) {
            expr = expr.replace(/Math\.(sin|cos|tan)\(([^)]+)\)/g, function(match, func, angle) {
                return `Math.${func}((${angle}) * Math.PI / 180)`;
            });
        }
        
        expr = expr.replace(/(\d+)!/g, function(match, num) {
            return factorial(parseInt(num));
        });

        return expr;
    }

    function factorial(n) {
        if (n < 0) return NaN;
        if (n === 0 || n === 1) return 1;
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return res;
    }

    function toggleDegRad() {
        isRadMode = !isRadMode;
        const modeText = isRadMode ? 'RAD' : 'DEG';
        degRadBtn.innerText = modeText;
        modeIndicator.innerText = modeText;
        updateDisplay();
    }

    function isOperator(token) {
        return ['+', '-', '*', '/', '('].includes(token);
    }

    function formatResult(num) {
        if (num === 0) return "0";
        let formatted = parseFloat(num.toFixed(10));
        if (Math.abs(formatted) >= 1e12 || (Math.abs(formatted) < 1e-6 && formatted !== 0)) {
            return num.toExponential(4);
        }
        return formatted.toString();
    }
</script>

</body>
</html>
